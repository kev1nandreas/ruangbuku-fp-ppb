services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruangbuku-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ruangbuku}
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      # MinIO: backend talks to the container over the compose network.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      # Presigned URLs must point at a host-reachable address for the client.
      MINIO_URL: ${MINIO_URL:-http://localhost:9000/ruangbuku}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ruangbuku}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ruangbuku

  postgres:
    image: postgres:16-alpine
    container_name: ruangbuku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ruangbuku}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_DATABASE:-ruangbuku}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ruangbuku

  minio:
    image: minio/minio:latest
    container_name: ruangbuku-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ruangbuku

  # One-shot job: create the bucket and make it publicly readable so that the
  # object URLs returned by the backend are viewable by clients.
  createbuckets:
    image: minio/mc:latest
    container_name: ruangbuku-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-ruangbuku};
      mc anonymous set download local/${MINIO_BUCKET:-ruangbuku};
      echo 'Bucket ${MINIO_BUCKET:-ruangbuku} ready';
      exit 0;
      "
    networks:
      - ruangbuku

volumes:
  postgres-data:
  minio-data:

networks:
  ruangbuku:
    driver: bridge
